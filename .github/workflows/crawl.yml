name: Daily Threat Intelligence Crawl

on:
  schedule:
    # Runs every day at 00:00 UTC (8:00 AM Beijing time)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  trigger-crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Trigger to VitaShield Crawler
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP Status: %{http_code}\n" \
            https://vita-shield.vercel.app/api/cron/crawl
